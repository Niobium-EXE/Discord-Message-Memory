<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Discord Message Memory</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header class="header">
      <div>
        <h1>Message Memory</h1>
        <p>Servers, DMs, and group DMs stay local to this browser.</p>
      </div>
      <span id="statusDot" class="status-dot" title="Discord hook status"></span>
    </header>

    <section class="controls">
      <div class="setting-row">
        <span>
          <span class="setting-title-row">
            <label for="checkForUpdatesEnabled">Check for updates</label>
            <span class="info-tip" tabindex="0" data-tip="Off by default. When enabled, ask the browser to check for a newer packed GitHub Release. Updates are not immediately reloaded by Message Memory. Chromium may still update extensions during its normal browser lifecycle.">i</span>
          </span>
          <small id="packedUpdateStatus">Packed update channel ready.</small>
        </span>
        <label class="switch-label" for="checkForUpdatesEnabled">
          <input id="checkForUpdatesEnabled" type="checkbox">
          <span class="switch" aria-hidden="true"></span>
        </label>
      </div>

      <div class="packed-apply-row">
        <div class="setting-title-row">
          <strong>Apply packed updates</strong>
          <span class="info-tip" tabindex="0" data-tip="Only click Apply update when an update is ready. On supported packed installations, this reloads Message Memory to apply the downloaded CRX. Unpacked installations cannot install a CRX this way. Existing local data stays under the same extension ID.">i</span>
        </div>
        <button id="applyPackedUpdate" class="packed-apply-button" type="button" disabled>Apply update</button>
      </div>

      <div class="setting-row">
        <span class="setting-title-row">
          <label for="rememberingEnabled">Remember messages</label>
          <span class="info-tip" tabindex="0" data-tip="Save messages, edits, deletions, embeds, and attachment files while Discord is running.">i</span>
        </span>
        <label class="switch-label" for="rememberingEnabled">
          <input id="rememberingEnabled" type="checkbox">
          <span class="switch" aria-hidden="true"></span>
        </label>
      </div>

      <div class="setting-row">
        <span class="setting-title-row">
          <label for="showingEnabled">Show remembered history</label>
          <span class="info-tip" tabindex="0" data-tip="Restore remembered deleted messages and show saved edit history directly in Discord.">i</span>
        </span>
        <label class="switch-label" for="showingEnabled">
          <input id="showingEnabled" type="checkbox">
          <span class="switch" aria-hidden="true"></span>
        </label>
      </div>
    </section>

    <div id="statusText" class="status-text">Checking Discord connection…</div>

    <div class="history-scroll-box">
      <div class="history-scroll-copy">
        <span class="setting-title-row">
          <strong>Refresh older history</strong>
          <span class="info-tip" tabindex="0" data-tip="Slowly scroll upward through the currently open Discord chat so older messages are loaded, re-snapshotted, and repaired while you do other things.">i</span>
        </span>
        <small id="autoScrollStatus">Slowly scroll upward through the open chat.</small>
      </div>
      <button id="autoScrollHistory" class="mini-button" type="button">Auto-scroll</button>
      <div class="history-speed-row">
        <label for="historyAutoScrollSpeed">Scroll speed</label>
        <span id="historyAutoScrollSpeedValue" class="history-speed-value">90 px/s</span>
        <span class="info-tip" tabindex="0" data-tip="Change the auto-scroll speed from 20 to 300 pixels per second. Changes take effect while scrolling and are saved for next time.">i</span>
        <input id="historyAutoScrollSpeed" type="range" min="20" max="300" step="10" value="90" aria-label="Auto-scroll speed in pixels per second">
        <div class="history-speed-ends"><span>Slower</span><span>Faster</span></div>
      </div>
    </div>

    <button id="openSettings" class="settings-button" type="button">Open extension settings</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
